<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil do Atleta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Top 10 Histórico</a>
    </div>
  </nav>

  <main class="container my-5">
    <div id="loading-text" class="text-center text-secondary">Carregando perfil...</div>
    <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

    <div id="player-card" class="card shadow-sm d-none">
      <div class="row g-0 align-items-center">
        <div class="col-md-4 text-center p-4">
          <img id="player-image" src="" alt="Imagem do atleta" class="player-img" />
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h1 id="player-name" class="display-6"></h1>
            <p id="player-country" class="text-secondary"></p>
            <p id="player-description"></p>
            <h5 class="mt-4">Principais títulos</h5>
            <ul id="player-titles" class="list-group list-group-flush"></ul>
            <div class="mt-4">
              <a href="index.html" class="btn btn-outline-primary">Voltar ao Top 10 Histórico</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-primary text-white text-center py-3">
    <div class="container">
      <p class="mb-0">Perfil do atleta carregado pela API local.</p>
    </div>
  </footer>

  <script src="js/player.js"></script>
</body>
</html>
